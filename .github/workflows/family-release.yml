name: Family Release

# Reusable release workflow for the Box-of-Dragons family. Releases are always
# manual: callers expose only `workflow_dispatch` and delegate everything here —
# whether a release is warranted, tag format, release notes, bot guards.
#
#   jobs:
#     release:
#       uses: Box-of-Dragons/StructuredChaos/.github/workflows/family-release.yml@master
#       secrets: inherit

on:
  workflow_call:
    inputs:
      create-tag:
        description: Create and push the computed vX.Y.Z tag
        type: boolean
        default: true
      create-release:
        description: Create a GitHub Release from the computed tag
        type: boolean
        default: true
      node-version:
        description: Node version to set up (empty = skip setup-node)
        type: string
        default: ''
      prepare-command:
        description: Shell command run after checkout, before planning (e.g. dependency install)
        type: string
        default: ''
      ai-notes:
        description: Reword release notes with AI (uses OPENAI_API_KEY or OPENROUTER_API_KEY when set; falls back to heuristic titles otherwise)
        type: boolean
        default: true
      project-description:
        description: Short description used in the AI prompt, e.g. "a knitting pattern design web app" (defaults to the repo name)
        type: string
        default: ''
      release-branch:
        description: Protected release branch (e.g. master). When set and the run was dispatched on another branch, the dispatch branch is merged in via PR and the tag lands on the merge commit.
        type: string
        default: ''
      deploy:
        description: Deploy to the VPS after a successful release run
        type: boolean
        default: true
      prod-path:
        description: Repo path on the server (defaults to PROD_PATH secret)
        type: string
        default: ''
      deploy-script:
        description: Repo-relative script run after git reset
        type: string
        default: scripts/deploy.sh
      environment:
        description: GitHub environment the deploy job runs under
        type: string
        default: production
      family-ref:
        description: Ref of StructuredChaos to pull the shared release script from
        type: string
        default: master
    outputs:
      release_tag:
        description: Tag that was (or would be) created, e.g. v1.4.0
        value: ${{ jobs.release.outputs.release_tag }}
      should_release:
        description: Whether a release-worthy bump was found
        value: ${{ jobs.release.outputs.should_release }}
      display_version:
        description: Display version for sites to render, e.g. v1.4.0
        value: ${{ jobs.release.outputs.display_version }}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: family-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.plan.outputs.release_tag }}
      should_release: ${{ steps.plan.outputs.should_release }}
      display_version: ${{ steps.plan.outputs.display_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out shared release tooling
        uses: actions/checkout@v4
        with:
          repository: Box-of-Dragons/StructuredChaos
          ref: ${{ inputs.family-ref }}
          path: .family
          sparse-checkout: |
            scripts/family-release.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Run prepare command
        if: inputs.prepare-command != ''
        run: ${{ inputs.prepare-command }}

      - name: Plan release
        id: plan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RELEASE_NOTES_MODEL: ${{ vars.OPENAI_RELEASE_NOTES_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: >-
          node .family/scripts/family-release.mjs plan --root=. --github-output
          --ai-notes=${{ inputs.ai-notes }}
          --project-description="${{ inputs.project-description }}"

      # Commit the AI note cache before tagging so the tag (and any deployed
      # site changelog that reads it) includes the fresh reworded notes.
      # chore(release-notes) commits are skipped by the planner, so this never
      # counts toward a bump.
      - name: Commit AI release-note cache
        if: inputs.ai-notes && steps.plan.outputs.should_release == 'true'
        run: |
          if [ ! -f release-notes.ai.json ]; then
            echo "No AI note cache produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${{ github.ref_name }}"
          git add release-notes.ai.json
          if git diff --cached --quiet; then
            echo "AI note cache unchanged."
            exit 0
          fi
          git commit -m "chore(release-notes): update AI release notes"
          git push

      # Protected release branches only accept merges via PR. Sync the
      # dispatch branch in, then merge the result back so the dispatch
      # branch contains the merge commit (and therefore the tag).
      - name: Sync into release branch via pull request
        if: inputs.release-branch != '' && github.ref_name != inputs.release-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          HEAD_BRANCH: ${{ github.ref_name }}
          SHOULD_RELEASE: ${{ steps.plan.outputs.should_release }}
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
        run: |
          git fetch origin "$RELEASE_BRANCH" "$HEAD_BRANCH"
          if [ "$(git rev-list --count origin/$RELEASE_BRANCH..HEAD)" -eq 0 ]; then
            echo "$RELEASE_BRANCH already up to date."
            git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
            exit 0
          fi
          if [ "$SHOULD_RELEASE" = "true" ]; then
            TITLE="Release $RELEASE_TAG"
          else
            TITLE="chore(release): merge $HEAD_BRANCH into $RELEASE_BRANCH"
          fi
          gh pr create --base "$RELEASE_BRANCH" --head "$HEAD_BRANCH" \
            --title "$TITLE" \
            --body "Automated release sync." || true
          gh pr merge --merge --subject "$TITLE" "$HEAD_BRANCH" || { sleep 5; gh pr merge --merge --subject "$TITLE" "$HEAD_BRANCH"; }

          git fetch origin "$RELEASE_BRANCH" "$HEAD_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          git merge "origin/$RELEASE_BRANCH" -m "chore(release): merge $RELEASE_BRANCH back into $HEAD_BRANCH"
          git push origin "$HEAD_BRANCH"
          git checkout "$RELEASE_BRANCH"

      - name: Check out release branch
        if: inputs.release-branch != '' && github.ref_name == inputs.release-branch
        env:
          RELEASE_BRANCH: ${{ inputs.release-branch }}
        run: |
          git fetch origin "$RELEASE_BRANCH"
          git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"

      - name: Create tag
        if: inputs.create-tag && steps.plan.outputs.should_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists."
            exit 0
          fi
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub release
        if: inputs.create-release && steps.plan.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
          NOTES_PATH: ${{ steps.plan.outputs.notes_path }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$NOTES_PATH" --target "$(git rev-parse HEAD)"
          fi

  # Deploy runs whenever the release job didn't fail — including runs where no
  # release was cut (docs-only commits still ship, they just don't tag).
  deploy:
    name: Deploy to VPS
    needs: release
    if: always() && inputs.deploy && !failure() && !cancelled()
    uses: Box-of-Dragons/StructuredChaos/.github/workflows/family-deploy.yml@master
    with:
      branch: ${{ inputs.release-branch != '' && inputs.release-branch || github.ref_name }}
      prod-path: ${{ inputs.prod-path }}
      deploy-script: ${{ inputs.deploy-script }}
      environment: ${{ inputs.environment }}
    secrets: inherit
