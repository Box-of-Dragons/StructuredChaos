name: Release

# Releases are always manual — Actions → Release → Run workflow.
# One action = version + tag + GitHub release + VPS deploy.
# All policy lives in the shared workflows (see docs/git-rules.md).

on:
  workflow_dispatch:

jobs:
  release:
    uses: ./.github/workflows/family-release.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      release-branch: master
    secrets: inherit
