<main class="page-main">

<script>window.SITE_FOOTER = {

<script src="/js/site-footer.js" defer></script>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js" crossorigin="anonymous"></script>
<script>
(function () {
    var target = document.getElementById('credits-content');
    if (!target || typeof window.marked === 'undefined') {
        if (target) {
            target.innerHTML = '<div class="panel panel--padded"><p>Could not load the markdown renderer. <a href="/credits.md">View raw credits.md</a>.</p></div>';
        }
        return;
    }

    // Split rendered markdown into per-heading panels inside the container,
    // matching the KnitStitch doc page layout convention (AGENTS.md:
    // "every headed section in the content column should live inside its
    // own .panel.panel--padded which is wrapped by a .container").
    function wrapContentInPanels(container) {
        var temp = document.createElement('div');
        while (container.firstChild) {
            temp.appendChild(container.firstChild);
        }
        container.innerHTML = '';

        var children = Array.prototype.slice.call(temp.childNodes);
        var currentPanel = null;

        children.forEach(function (node) {
            if (node.nodeType === Node.ELEMENT_NODE && node.tagName.toLowerCase() === 'hr') {
                return;
            }

            if (node.nodeType === Node.ELEMENT_NODE && /^H[1-6]$/i.test(node.tagName)) {
                currentPanel = document.createElement('div');
                currentPanel.className = 'panel panel--padded';
                container.appendChild(currentPanel);
            }

            if (node.nodeType === Node.TEXT_NODE && node.textContent.trim() === '') {
                return;
            }

            if (!currentPanel) {
                currentPanel = document.createElement('div');
                currentPanel.className = 'panel panel--padded';
                container.appendChild(currentPanel);
            }

            currentPanel.appendChild(node);
        });
    }

    fetch('/credits.md?t=' + Date.now())
        .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
        })
        .then(function (md) {
            target.innerHTML = window.marked.parse(md);
            wrapContentInPanels(target);
        })
        .catch(function (err) {
            target.innerHTML = '<div class="panel panel--padded"><p>Failed to load credits: ' + err.message + '. <a href="/credits.md">View raw credits.md</a>.</p></div>';
        });
})();
</script>
</body>
</html>
